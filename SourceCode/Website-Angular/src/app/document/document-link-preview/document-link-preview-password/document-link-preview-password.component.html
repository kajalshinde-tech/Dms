<div class="saas-dialog-container position-relative">
  <!-- Header -->
  <div class="saas-dialog-header">
    <div class="header-info-box">
      <div class="dialog-icon-badge warning-badge">
        <mat-icon>lock</mat-icon>
      </div>
      <div>
        <h5 class="dialog-title mb-0">{{ "LINK_IS_PASSWORD_PROTECTED" | translate }}</h5>
        <p class="dialog-subtitle mb-0">Enter the access password to view this document</p>
      </div>
    </div>
  </div>

  <!-- Body -->
  <mat-dialog-content class="saas-dialog-body custom-scroll">
    <form (ngSubmit)="checkPassword()" [formGroup]="documentLinkForm" id="linkPasswordForm">
      <div class="row g-3 align-items-center">
        <div class="col-12 text-center py-2">
          <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-light border mb-2">
            <mat-icon class="text-primary" style="font-size: 48px; width: 48px; height: 48px;">https</mat-icon>
          </div>
        </div>
        <div class="col-12">
          <div class="form-group mb-0">
            <label class="form-label-custom" for="linkPassword">{{'PASSWORD' | translate}} <span class="required-star">*</span></label>
            <input type="password" class="form-control doc-form-input" formControlName="password" id="linkPassword"
              placeholder="{{ 'ENTER_PASSWORD' | translate }}" cdkFocusInitial>
            @if (documentLinkForm.get('password')?.touched && documentLinkForm.get('password')?.errors?.['required']) {
              <div class="field-error-text">
                {{'PASSWORD_IS_REQUIRED' | translate}}
              </div>
            }
          </div>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <!-- Footer Actions -->
  <mat-dialog-actions class="saas-dialog-footer">
    <button type="button" class="btn btn-primary-custom" (click)="checkPassword()">
      <mat-icon>lock_open</mat-icon>
      <span>{{'SUBMIT' | translate}}</span>
    </button>
  </mat-dialog-actions>
</div>
