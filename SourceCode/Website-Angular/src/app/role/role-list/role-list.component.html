<section class="content">
  <div class="container-fluid">
    <!-- Standardized Page Header -->
    <div class="page-header-row mb-2 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <mat-icon class="page-title-icon align-middle">admin_panel_settings</mat-icon>
        <span class="mb-0 page-title">
          {{ "ROLES" | translate }}
        </span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-header-primary" [routerLink]="['/roles/manage']" matTooltip="{{ 'ADD_ROLE' | translate }}">
          <mat-icon class="btn-icon">add</mat-icon>
          <span class="d-none d-sm-inline">{{ "ADD_ROLE" | translate }}</span>
        </button>
      </div>
    </div>

    <!-- Main Table Card -->
    <div class="doc-table-card">
      <div class="table-responsive">
        <table class="modern-doc-table w-100" mat-table [dataSource]="roles">
          
          <!-- 1. Action Column -->
          <ng-container matColumnDef="action">
            <th class="table-column-100" mat-header-cell *matHeaderCellDef>{{ "ACTION" | translate }}</th>
            <td class="table-column-100" mat-cell *matCellDef="let role">
              <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn-action-edit" *hasClaim="'EDIT_ROLE'"
                  [routerLink]="['/roles/manage', role.id]" matTooltip="{{ 'EDIT' | translate }}">
                  <mat-icon class="action-icon">edit</mat-icon>
                </button>
                <button type="button" class="btn-action-delete" *hasClaim="'DELETE_ROLE'"
                  (click)="deleteRole(role)" matTooltip="{{ 'DELETE' | translate }}">
                  <mat-icon class="action-icon">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <!-- 2. Role Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ "NAME" | translate }}</th>
            <td mat-cell *matCellDef="let role">
              <div class="d-flex align-items-center gap-2">
                <div class="role-icon-circle">
                  <mat-icon class="role-icon">badge</mat-icon>
                </div>
                <span class="role-name-text">{{ role.name }}</span>
              </div>
            </td>
          </ng-container>

          <tr class="grid-header-row" mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr class="grid-body-row" mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr *matNoDataRow class="mat-row">
            <td colspan="2" class="p-4 text-center text-muted">
              <div class="empty-state d-flex flex-column align-items-center justify-content-center py-3">
                <mat-icon class="fs-2 text-muted mb-1">admin_panel_settings</mat-icon>
                <span class="fs-7 font-weight-bold">{{ "NO_DATA_FOUND" | translate }}</span>
              </div>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- Loading Spinner Overlay -->
@if(isLoadingResults) {
<div class="spinner-container">
  <mat-progress-spinner mode="indeterminate" diameter="50" strokeWidth="4">
  </mat-progress-spinner>
</div>
}
