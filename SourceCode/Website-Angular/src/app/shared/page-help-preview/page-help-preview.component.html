<div class="saas-dialog-container position-relative">
  <!-- Dialog Header -->
  <div class="saas-dialog-header">
    <div class="header-info-box">
      <div class="dialog-icon-badge info-badge">
        <mat-icon>menu_book</mat-icon>
      </div>
      <div>
        <div class="d-flex align-items-center gap-2">
          <h5 class="dialog-title mb-0">{{ data.name }}</h5>
          <span class="badge bg-light text-muted border px-2 py-0 fs-11">{{ data.code }}</span>
        </div>
        <p class="dialog-subtitle mb-0">Help guide and documentation</p>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button *hasClaim="'MANAGE_PAGE_HELPER'" type="button" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" (click)="editPageHelper()"
        matTooltip="{{ 'EDIT' | translate }}">
        <mat-icon class="fs-6">edit</mat-icon>
        <span class="d-none d-sm-inline">{{ 'EDIT' | translate }}</span>
      </button>
      <button type="button" class="dialog-close-btn" (click)="onCancel()"
        matTooltip="{{ 'CLOSE' | translate }}">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Dialog Body -->
  <mat-dialog-content class="saas-dialog-body custom-scroll">
    <div class="doc-card-section mb-0">
      <app-text-editor [hideToolBar]="true" [disabled]="true" [(ngModel)]="data.description"></app-text-editor>
    </div>
  </mat-dialog-content>

  <!-- Dialog Footer -->
  <mat-dialog-actions class="saas-dialog-footer">
    <button type="button" class="btn btn-saas-cancel" (click)="onCancel()">
      <mat-icon>close</mat-icon>
      <span>{{ "CLOSE" | translate }}</span>
    </button>
  </mat-dialog-actions>
</div>
